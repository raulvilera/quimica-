const $ = id => document.getElementById(id);
const LETRAS = 'ABCDE';

// ---------- Monta as questões ----------
(function montarQuestoes() {
  const box = $('questoes');
  QUESTOES.forEach(q => {
    const obj = !!q.alts;
    let h = `<div class="questao-titulo">QUESTÃO ${q.n} (${obj ? 'Objetiva' : 'Dissertativa'}) - ${q.tit}</div>
      <div class="questao-enunciado">${q.enun}</div>
      <figure class="questao-imagem"><img src="${BASE_IMG}${q.img}.png" alt="${q.cap}" onerror="this.parentElement.style.display='none'"><figcaption>${q.cap}</figcaption></figure>`;
    if (obj) {
      h += `<div class="alternativas" data-questao="Q${q.n}">` +
        q.alts.map((t, i) => `<label class="alternativa" data-letra="${LETRAS[i]}"><strong>${LETRAS[i]})</strong> ${t}</label>`).join('') + '</div>';
    } else {
      h += `<textarea class="campo-dissertativa" id="Q${q.n}" placeholder="Sua resposta aqui..."></textarea>
        <div class="criterios"><strong>Critérios de Avaliação:</strong><br>${q.crit.join('<br>')}</div>`;
    }
    const d = document.createElement('div');
    d.className = 'questao';
    d.innerHTML = h;
    box.appendChild(d);
  });
})();

// ---------- Seleção das alternativas (letra guardada em data-selecionada) ----------
document.addEventListener('click', e => {
  const alt = e.target.closest('.alternativa');
  if (!alt) return;
  const grupo = alt.parentElement;
  grupo.querySelectorAll('.alternativa').forEach(a => a.classList.remove('selecionada'));
  alt.classList.add('selecionada');
  grupo.dataset.selecionada = alt.dataset.letra;
});

function limparSelecoes() {
  document.querySelectorAll('.alternativa').forEach(a => a.classList.remove('selecionada'));
  document.querySelectorAll('.alternativas').forEach(g => delete g.dataset.selecionada);
}

// ---------- Turma / aluno ----------
$('turma').addEventListener('change', function () {
  const sel = $('nome');
  sel.innerHTML = '<option value="">-- Selecione o nome --</option>';
  $('ra').value = ''; $('email').value = '';
  if (this.value === '3ª Série F') {
    ALUNOS.forEach(a => {
      const o = document.createElement('option');
      o.value = o.textContent = a.nome;
      sel.appendChild(o);
    });
  }
});

$('nome').addEventListener('change', function () {
  const a = ALUNOS.find(x => x.nome === this.value);
  $('ra').value = a ? a.ra : '';
  $('email').value = a ? a.email : '';
});

// ---------- Mensagens (topo e fim da página) ----------
let timerMsg;
function mostrarMensagem(texto, tipo) {
  ['mensagem', 'mensagemFim'].forEach(id => { $(id).textContent = texto; $(id).className = 'mensagem ' + tipo; });
  $('mensagemFim').scrollIntoView({ behavior: 'smooth', block: 'center' });
  clearTimeout(timerMsg);
  if (tipo === 'erro') {
    timerMsg = setTimeout(() => ['mensagem', 'mensagemFim'].forEach(id => $(id).className = 'mensagem'), 10000);
  }
}

// ---------- Limpar ----------
$('btnLimpar').addEventListener('click', () => {
  if (!confirm('Deseja realmente limpar todas as respostas?')) return;
  limparSelecoes();
  document.querySelectorAll('textarea').forEach(t => t.value = '');
  $('formulario').reset();
});

// ---------- Enviar ----------
$('formulario').addEventListener('submit', e => { e.preventDefault(); enviarRespostas(); });

function enviarRespostas() {
  const turma = $('turma').value, nome = $('nome').value;
  if (!turma || !nome) { mostrarMensagem('Por favor, selecione a turma e o nome do aluno!', 'erro'); return; }

  const dados = { turma, nome, ra: $('ra').value, email: $('email').value };

  const faltando = [];
  for (let i = 1; i <= 7; i++) {
    const g = document.querySelector(`.alternativas[data-questao="Q${i}"]`);
    dados['Q' + i] = (g && g.dataset.selecionada) || '';
    if (!dados['Q' + i]) faltando.push(i);
  }
  if (faltando.length && !confirm('Você não respondeu as questões: ' + faltando.join(', ') + '. Deseja enviar mesmo assim?')) return;

  for (let i = 8; i <= 10; i++) dados['Q' + i] = $('Q' + i).value.trim();
  dados.data_hora = new Date().toLocaleString('pt-BR');

  const btn = $('btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Registrando respostas...';

  fetch(googleSheetURL, { method: 'POST', body: JSON.stringify(dados) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (data.status !== 'sucesso') throw new Error(data.mensagem || 'Registro não confirmado.');
      mostrarMensagem('✓ ' + data.mensagem, 'sucesso');
      $('formulario').reset();
      limparSelecoes();
    })
    .catch(err => {
      console.error('Erro:', err);
      mostrarMensagem('Não foi possível registrar as respostas: ' + err.message, 'erro');
    })
    .finally(() => { btn.disabled = false; btn.textContent = 'Enviar Respostas'; });
}
</script>
</body>
</html>
